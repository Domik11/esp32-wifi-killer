name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0 pyserial==3.5
      - run: python -m unittest discover -s windows_app -v
      - run: pio run
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r windows_app/requirements.txt
      - run: python -m unittest discover -s windows_app -v
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name ESP32-Network windows_app/app.py
